name: Build Single HTML

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Rename to single file
        run: mv dist/index.html dist/RQI-Marketing-Impact-Report.html

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RQI-Marketing-Impact-Report
          path: dist/RQI-Marketing-Impact-Report.html
